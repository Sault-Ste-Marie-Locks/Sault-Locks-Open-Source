.returning-option{

}
.returning-option:active{transform:scale(.99);}
.returning-option input{
    position:absolute !important;
    width:1px !important;
    height:1px !important;
    min-width:1px !important;
    margin:0 !important;

}
.returning-option-copy strong{color:var(--text);font-size:14px;font-weight:950;}
.returning-option-copy small{color:var(--muted);font-size:12px;line-height:1.35;font-weight:750;}
.returning-toggle{
    position:relative;
    width:50px;
    height:30px;
    min-width:50px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    background:var(--card-3);
    transition:background .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.returning-toggle::after{
    content:'';
    position:absolute;
    left:3px;
    top:3px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.28);
    transition:transform .16s ease;
}
.returning-option input:checked ~ .returning-toggle{
    background:var(--blue);
    border-color:var(--blue-border);
}
.returning-option input:checked ~ .returning-toggle::after{transform:translateX(20px);}
.returning-option input:focus-visible ~ .returning-toggle{box-shadow:0 0 0 4px rgba(var(--accent-rgb,52,141,188),.20);}

        <script>
/* RETURN_TOGGLE_PATCH_20260912 */
document.addEventListener("DOMContentLoaded", function(){
    const row = document.querySelector(".returning-option");
    const box = document.getElementById("returningExpected");

    if(!row || !box || row.dataset.returnToggleReady === "1") return;

    row.dataset.returnToggleReady = "1";

    row.addEventListener("click", function(event){
        event.preventDefault();

        box.checked = !box.checked;

        box.dispatchEvent(new Event("input", {
            bubbles:true
        }));

        box.dispatchEvent(new Event("change", {
            bubbles:true
        }));
    });
});

<script>
// This must exist before app.js loads. Older builds expect #vessel to be a select.
window.getRealSelectValue = function(selectId, manualId){
    const field = document.getElementById(selectId);
    const manual = document.getElementById(manualId) ||
        (selectId === "vessel" ? document.getElementById("vesselManual") : null);

    if(!field) return "";

    if(field.tagName !== "SELECT"){
        return String(field.value || "").trim();
    }

    const selectedOption = field.options[field.selectedIndex];
    const selectedValue = String(field.value || "").trim();

    if(selectedOption && selectedOption.dataset.manual === "true"){
        return String((manual && manual.value) || selectedValue || "").trim();
    }

    return selectedValue;
};
</script>

<script>
function getTimeSetting(){
    return localStorage.getItem("timeFormat") || "12";
}

function formatDisplayTime(date){
    return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
}

function setCurrentTime(force){
    const input = document.getElementById("entryTime");
    if(!input) return;
    if(force !== true && String(input.value || "").trim()) return;
    const now = new Date();
    input.value = formatDisplayTime(now);
    input.dispatchEvent(new Event("input", { bubbles:true }));
    input.dispatchEvent(new Event("change", { bubbles:true }));
}

function cleanManualTime(value){
    return String(value || "").trim();
}

setCurrentTime();
const dirSelect = document.getElementById("dir");

dirSelect.addEventListener("change", function(){
    if(this.value === ""){
        this.classList.add("placeholder");
    }else{
        this.classList.remove("placeholder");
    }
});

const form = document.getElementById("entryForm");
const popup = document.getElementById("missingPopup");
const missingList = document.getElementById("missingList");
const cancelSubmit = document.getElementById("cancelSubmit");
const continueSubmit = document.getElementById("continueSubmit");

let allowBypassSubmit = false;

function getMissingFields(){
    const requiredFields = [
        {
            id:"reg",
            name:"Registration"
        },
        {
            id:"dir",
            name:"Direction"
        },
        {
            id:"pass",
            name:"Passenger Count"
        },
        {
            id:"dest",
            name:"Destination"
        },
        {
            id:"homePort",
            name:"Home Port"
        },
        {
            id:"entryTime",
            name:"Time"
        }
    ];

    return requiredFields.filter(field => {
        const el = document.getElementById(field.id);
        return !String(el.value || "").trim();
    });
}

function showMissingPopup(missing){
    missingList.innerHTML = "";

    missing.forEach(field => {
        const item = document.createElement("div");
        item.textContent = "• " + field.name;
        missingList.appendChild(item);
    });

    popup.classList.add("active");
}

function hideMissingPopup(){
    popup.classList.remove("active");
}

form.addEventListener("submit", function(e){
    if(allowBypassSubmit){
        return;
    }

    if(window.shouldConfirmBeforeSave && !window.shouldConfirmBeforeSave()){
        e.preventDefault();
        e.stopImmediatePropagation();
        return false;
    }

    const missing = getMissingFields();

    if(missing.length > 0){
        e.preventDefault();
        e.stopImmediatePropagation();

        showMissingPopup(missing);
        return false;
    }
}, true);

cancelSubmit.addEventListener("click", function(){
    hideMissingPopup();
});

continueSubmit.addEventListener("click", function(){
    allowBypassSubmit = true;
    hideMissingPopup();
    form.requestSubmit();
    queueMicrotask(() => {
        allowBypassSubmit = false;
    });
});

popup.addEventListener("click", function(e){
    if(e.target === popup){
        hideMissingPopup();
    }
});


function initRecreationalBoatPresetDropdown(){
    const input = document.getElementById("vesselSearch");
    const valueSelect = document.getElementById("vessel");
    const manualValue = document.getElementById("vesselManual");
    const reg = document.getElementById("reg");
    const homePort = document.getElementById("homePort");
    const dest = document.getElementById("dest");
    const combo = document.getElementById("rbPresetCombo");
    const toggle = document.getElementById("rbPresetToggle");
    const menu = document.getElementById("rbPresetMenu");
    const hint = document.getElementById("rbPresetHint");

    if(!input || !valueSelect || !manualValue || !combo || !toggle || !menu) return;
    if(combo.dataset.ready === "true") return;
    combo.dataset.ready = "true";

    let activeIndex = -1;
    let cachedPresets = [];
    let visiblePresets = [];
    let selectedPresetKey = "";

    function clean(value){
        return String(value === undefined || value === null ? "" : value).trim();
    }

    function safeParse(value, fallback){
        if(!value) return fallback;
        try{
            const parsed = JSON.parse(value);
            return parsed === undefined || parsed === null ? fallback : parsed;
        }catch(error){
            console.warn("Preset data could not be parsed:", error);
            return fallback;
        }
    }

    // Avoid parsing a giant history database just to open a dropdown.
    function readStorageJson(key, fallback, maxLength){
        try{
            const raw = localStorage.getItem(key);
            if(!raw) return fallback;
            if(maxLength && raw.length > maxLength){
                console.warn(`Skipped oversized preset source: ${key}`);
                return fallback;
            }
            return safeParse(raw, fallback);
        }catch(error){
            console.warn(`Could not read preset source: ${key}`, error);
            return fallback;
        }
    }

    function getPresetHomePort(preset){
        return clean(
            preset.homePort ||
            preset.homeport ||
            preset.home_port ||
            preset.port ||
            [preset.city, preset.state, preset.country].filter(Boolean).join(", ")
        );
    }

    function normalizePreset(item, fallbackName){
        if(typeof item === "string"){
            const name = clean(item);
            return name ? { name, reg:"", homePort:"", destination:"", owner:"" } : null;
        }

        if(!item || typeof item !== "object") return null;

        const name = clean(
            item.name ||
            item.vessel ||
            item.vesselName ||
            item.boatName ||
            fallbackName
        );
        if(!name) return null;

        return {
            name,
            reg:clean(
                item.registration ||
                item.reg ||
                item.vesselReg ||
                item.vesselRegistration ||
                item.registrationNumber
            ),
            homePort:getPresetHomePort(item),
            destination:clean(item.destination || item.dest),
            owner:clean(item.owner)
        };
    }

    function appendPresetSource(target, source){
        if(Array.isArray(source)){
            source.forEach(item => {
                const preset = normalizePreset(item, "");
                if(preset) target.push(preset);
            });
            return;
        }

        if(source && typeof source === "object"){
            Object.entries(source).forEach(([name, item]) => {
                const preset = typeof item === "object"
                    ? normalizePreset(item, name)
                    : normalizePreset({ name, registration:item }, name);
                if(preset) target.push(preset);
            });
        }
    }

    function readPresetsFromSelect(){
        return Array.from(valueSelect.options).map(option => {
            if(!clean(option.value) || option.dataset.manual === "true") return null;
            return normalizePreset({
                name:clean(option.dataset.name || option.textContent || option.value),
                registration:option.dataset.registration || option.dataset.reg,
                homePort:option.dataset.homePort || option.dataset.homeport,
                destination:option.dataset.destination || option.dataset.dest,
                owner:option.dataset.owner
            }, clean(option.value));
        }).filter(Boolean);
    }

    function readLocalPresetSources(){
        const sources = [];

        try{
            if(typeof getVesselPresets === "function"){
                sources.push(getVesselPresets("RB"));
            }
        }catch(error){
            console.warn("getVesselPresets failed:", error);
        }

        try{
            if(typeof vesselPresetGroups !== "undefined" && vesselPresetGroups){
                sources.push(vesselPresetGroups.RB);
            }
        }catch(error){
            console.warn("vesselPresetGroups could not be read:", error);
        }

        const byType = readStorageJson("ssmCanalDashboard.entryPresets.byType", null, 1500000);
        if(byType) sources.push(byType.RB || byType.recreational || byType["Recreational Boat"]);

        const oldPresets = readStorageJson("ssmCanalDashboard.entryPresets", null, 1500000);
        if(oldPresets){
            sources.push(oldPresets.RB || oldPresets.recreational || oldPresets["Recreational Boat"] || oldPresets);
        }

        // Legacy fallback only. Parse once, and skip it when the dashboard state is huge.
        const dashboard = readStorageJson("ssmCanalDashboard.v1", null, 1500000);
        if(dashboard){
            if(dashboard.entryPresets){
                sources.push(
                    dashboard.entryPresets.RB ||
                    dashboard.entryPresets.recreational ||
                    dashboard.entryPresets["Recreational Boat"]
                );
            }

            if(Array.isArray(dashboard.registry)){
                sources.push(dashboard.registry.filter(item => {
                    const type = clean(item.type || item.vesselType || item.entryType).toLowerCase();
                    return type === "rb" || type.includes("recreational");
                }));
            }
        }

        sources.push(readPresetsFromSelect());
        return sources;
    }

    function uniquePresets(list){
        const map = new Map();

        list.forEach(preset => {
            if(!preset || !clean(preset.name)) return;
            const key = clean(preset.name).toLowerCase();
            const current = map.get(key);

            if(!current){
                map.set(key, { ...preset });
                return;
            }

            map.set(key, {
                name:current.name || preset.name,
                reg:current.reg || preset.reg,
                homePort:current.homePort || preset.homePort,
                destination:current.destination || preset.destination,
                owner:current.owner || preset.owner
            });
        });

        return Array.from(map.values()).sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { sensitivity:"base" })
        );
    }

    function refreshPresets(){
        const output = [];
        readLocalPresetSources().forEach(source => appendPresetSource(output, source));
        cachedPresets = uniquePresets(output);

        if(hint){
            hint.textContent = cachedPresets.length
                ? `${cachedPresets.length} recreational preset${cachedPresets.length === 1 ? "" : "s"} available.`
                : "No recreational presets found. You can still type a vessel name manually.";
        }
    }

    function filteredPresets(){
        const query = clean(input.value).toLowerCase();
        if(!query) return cachedPresets.slice(0, 100);

        return cachedPresets.filter(preset => [
            preset.name,
            preset.reg,
            preset.owner,
            preset.homePort,
            preset.destination
        ].join(" ").toLowerCase().includes(query)).slice(0, 100);
    }

    function ensureSelectOption(preset, isManual){
        const name = clean(preset && preset.name);
        if(!name) return null;

        const key = name.toLowerCase();
        let option;

        if(isManual){
            option = valueSelect.querySelector('option[data-page-manual="true"]');
        }else{
            option = Array.from(valueSelect.options).find(item =>
                item.dataset.pageManual !== "true" &&
                clean(item.dataset.presetKey || item.value).toLowerCase() === key
            );
        }

        if(!option){
            option = document.createElement("option");
            valueSelect.appendChild(option);
        }

        option.value = name;
        option.textContent = name;
        option.dataset.presetKey = key;
        option.dataset.manual = isManual ? "true" : "false";
        option.dataset.pageManual = isManual ? "true" : "false";
        option.dataset.registration = clean(preset.reg);
        option.dataset.homePort = clean(preset.homePort);
        option.dataset.destination = clean(preset.destination);
        option.dataset.owner = clean(preset.owner);
        return option;
    }

    function dispatchValueEvents(field){
        field.dispatchEvent(new Event("input", { bubbles:true }));
        field.dispatchEvent(new Event("change", { bubbles:true }));
    }

    function syncManualValue(){
        const name = clean(input.value);
        manualValue.value = name;
        selectedPresetKey = "";

        if(!name){
            valueSelect.value = "";
            dispatchValueEvents(valueSelect);
            return;
        }

        const option = ensureSelectOption({ name }, true);
        valueSelect.value = option.value;
        dispatchValueEvents(valueSelect);
    }

    function setFieldValue(field, value, overwrite){
        if(!field) return;
        const next = clean(value);
        if(!next) return;
        if(!overwrite && clean(field.value)) return;

        field.value = next;
        dispatchValueEvents(field);
    }

    function selectPreset(preset){
        if(!preset) return;

        selectedPresetKey = clean(preset.name).toLowerCase();
        input.value = preset.name;
        manualValue.value = preset.name;

        const option = ensureSelectOption(preset, false);
        valueSelect.value = option.value;
        dispatchValueEvents(valueSelect);

        setFieldValue(reg, preset.reg, true);
        setFieldValue(homePort, preset.homePort, true);
        setFieldValue(dest, preset.destination, false);

        input.dispatchEvent(new Event("change", { bubbles:true }));
        closeMenu();
    }

    function renderMenu(){
        visiblePresets = filteredPresets();
        activeIndex = -1;
        menu.replaceChildren();

        if(!visiblePresets.length){
            const empty = document.createElement("div");
            empty.className = "rb-preset-empty";
            empty.textContent = "No matching presets. Keep typing to enter the vessel manually.";
            menu.appendChild(empty);
            return;
        }

        const fragment = document.createDocumentFragment();

        visiblePresets.forEach((preset, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "rb-preset-option";
            button.dataset.index = String(index);
            button.setAttribute("role", "option");

            const title = document.createElement("strong");
            title.textContent = preset.name;

            const meta = document.createElement("span");
            meta.textContent = [
                preset.reg || "No registration",
                preset.homePort,
                preset.owner
            ].filter(Boolean).join(" • ");

            button.append(title, meta);
            button.addEventListener("click", () => selectPreset(preset));
            fragment.appendChild(button);
        });

        menu.appendChild(fragment);
    }

    function openMenu(){
        if(menu.classList.contains("open")){
            renderMenu();
            return;
        }
        renderMenu();
        menu.classList.add("open");
        input.setAttribute("aria-expanded", "true");
        toggle.setAttribute("aria-expanded", "true");
    }

    function closeMenu(){
        menu.classList.remove("open");
        input.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-expanded", "false");
        activeIndex = -1;
    }

    function updateActive(){
        const buttons = Array.from(menu.querySelectorAll(".rb-preset-option"));
        buttons.forEach(button => button.classList.remove("active"));

        const activeButton = buttons[activeIndex];
        if(activeButton){
            activeButton.classList.add("active");
            activeButton.scrollIntoView({ block:"nearest" });
        }
    }

    async function pullFreshPresets(){
        if(location.protocol === "file:") return;

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);

        try{
            const response = await fetch("/api/presets", {
                cache:"no-store",
                signal:controller.signal,
                headers:{ "Accept":"application/json" }
            });
            if(!response.ok) return;

            const payload = await response.json();
            const entryPresets = payload && (
                payload.entryPresets ||
                payload.presetsByType ||
                (payload.data && payload.data.entryPresets)
            );

            if(entryPresets && typeof entryPresets === "object"){
                localStorage.setItem(
                    "ssmCanalDashboard.entryPresets.byType",
                    JSON.stringify(entryPresets)
                );
                refreshPresets();
                if(menu.classList.contains("open")) renderMenu();
            }
        }catch(error){
            if(error && error.name !== "AbortError"){
                console.warn("Fresh presets could not be loaded:", error);
            }
        }finally{
            clearTimeout(timeout);
        }
    }

    input.addEventListener("focus", openMenu);
    input.addEventListener("input", function(){
        const currentKey = clean(input.value).toLowerCase();
        if(currentKey !== selectedPresetKey) syncManualValue();
        openMenu();
    });

    toggle.setAttribute("aria-expanded", "false");
    toggle.addEventListener("click", function(){
        if(menu.classList.contains("open")){
            closeMenu();
            return;
        }

        openMenu();
        try{
            input.focus({ preventScroll:true });
        }catch(error){
            input.focus();
        }
    });

    input.addEventListener("keydown", function(event){
        if(event.key === "Escape"){
            closeMenu();
            return;
        }

        if(!menu.classList.contains("open") && (event.key === "ArrowDown" || event.key === "ArrowUp")){
            openMenu();
        }

        const buttons = Array.from(menu.querySelectorAll(".rb-preset-option"));
        if(!buttons.length) return;

        if(event.key === "ArrowDown"){
            event.preventDefault();
            activeIndex = Math.min(activeIndex + 1, buttons.length - 1);
            updateActive();
        }else if(event.key === "ArrowUp"){
            event.preventDefault();
            activeIndex = activeIndex <= 0 ? buttons.length - 1 : activeIndex - 1;
            updateActive();
        }else if(event.key === "Enter" && activeIndex >= 0){
            event.preventDefault();
            selectPreset(visiblePresets[activeIndex]);
        }
    });

    document.addEventListener("pointerdown", function(event){
        if(!combo.contains(event.target)) closeMenu();
    }, { passive:true });

    window.addEventListener("storage", function(event){
        if(event.key && event.key.includes("entryPresets")){
            refreshPresets();
            if(menu.classList.contains("open")) renderMenu();
        }
    });

    refreshPresets();
    syncManualValue();
    pullFreshPresets();
}

if(typeof setupNormalForm === "function"){
    setupNormalForm("Recreational Boat");
}
initRecreationalBoatPresetDropdown();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(()=>{});
    });
}
</script>

</body>
