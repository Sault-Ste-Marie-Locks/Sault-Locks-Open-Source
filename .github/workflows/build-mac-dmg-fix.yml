name: Build Proper macOS DMG

on:
  push:
    branches: [ build-mac-dmg-fix ]
  workflow_dispatch:

jobs:
  mac-dmg:
    runs-on: macos-15
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set version and signing mode
        run: |
          set -euo pipefail
          echo "BUILD_VERSION=1.0.64" >> "$GITHUB_ENV"
          node -e "let p=require('./package.json');p.version='1.0.64';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

          SIGNING_READY=0
          if [ -n "${MACOS_CERT_P12_BASE64:-}" ] && [ -n "${MACOS_CERT_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            SIGNING_READY=1
          fi
          echo "SIGNING_READY=$SIGNING_READY" >> "$GITHUB_ENV"

          NOTARY_MODE="none"
          if [ "$SIGNING_READY" -eq 1 ]; then
            if [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER_ID:-}" ] && [ -n "${APPLE_API_KEY_P8_BASE64:-}" ]; then
              NOTARY_MODE="api"
            elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
              NOTARY_MODE="appleid"
            fi
          fi
          echo "NOTARY_MODE=$NOTARY_MODE" >> "$GITHUB_ENV"

      - name: Decode exact custom drive icon
        run: |
          set -euo pipefail
          mkdir -p dmg-art
          /usr/bin/base64 -D < assets/dmg-volume-icon.png > dmg-art/drive-icon.png
          test -s dmg-art/drive-icon.png
          file dmg-art/drive-icon.png
          sips -g pixelWidth -g pixelHeight -g format dmg-art/drive-icon.png

      - name: Install Developer ID certificate
        if: env.SIGNING_READY == '1'
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/lock-release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12_BASE64" | /usr/bin/base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Create Electron entitlements
        run: |
          cat > "$RUNNER_TEMP/entitlements.mac.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Build app icon
        run: |
          set -euo pipefail
          rm -rf app.iconset && mkdir app.iconset
          SRC="assets/lock-release.png"
          sips -z 16 16 "$SRC" --out app.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 "$SRC" --out app.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 "$SRC" --out app.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 "$SRC" --out app.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 "$SRC" --out app.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 "$SRC" --out app.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 "$SRC" --out app.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 "$SRC" --out app.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 "$SRC" --out app.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 "$SRC" --out app.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns app.iconset -o assets/lock-release.icns

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @electron/universal

      - name: Build universal app
        run: |
          set -euo pipefail
          rm -rf dist-x64 dist-arm64 dist-universal dmg-root
          npx electron-packager . "Lock Release" --platform=darwin --arch=x64 --overwrite --out=dist-x64 --ignore="^/dist" --ignore="^/update-payload"
          npx electron-packager . "Lock Release" --platform=darwin --arch=arm64 --overwrite --out=dist-arm64 --ignore="^/dist" --ignore="^/update-payload"
          mkdir -p dist-universal
          node <<'NODE'
          const path=require('path');
          const {makeUniversalApp}=require('@electron/universal');
          makeUniversalApp({
            x64AppPath:path.resolve('dist-x64/Lock Release-darwin-x64/Lock Release.app'),
            arm64AppPath:path.resolve('dist-arm64/Lock Release-darwin-arm64/Lock Release.app'),
            outAppPath:path.resolve('dist-universal/Lock Release.app'),
            force:true
          }).catch(e=>{console.error(e);process.exit(1)});
          NODE

          APP="dist-universal/Lock Release.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ca.unrealstudios.lockrelease" "$APP/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string ca.unrealstudios.lockrelease" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Lock Release" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Lock Release" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile lock-release.icns" "$APP/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string lock-release.icns" "$APP/Contents/Info.plist"
          cp assets/lock-release.icns "$APP/Contents/Resources/lock-release.icns"

          if [ "$SIGNING_READY" = "1" ]; then
            codesign --force --deep --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" --options runtime --timestamp --entitlements "$RUNNER_TEMP/entitlements.mac.plist" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create polished installer background
        run: |
          set -euo pipefail
          mkdir -p dmg-root/.background
          ditto "dist-universal/Lock Release.app" "dmg-root/Lock Release.app"
          ln -s /Applications "dmg-root/Applications"
          cat > "$RUNNER_TEMP/make-dmg-bg.swift" <<'SWIFT'
          import AppKit
          let canvas = NSSize(width: 760, height: 480)
          let image = NSImage(size: canvas)
          image.lockFocus()
          NSColor(calibratedWhite: 0.985, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(origin: .zero, size: canvas)).fill()
          let line = NSBezierPath()
          line.move(to: NSPoint(x: 0, y: 392)); line.line(to: NSPoint(x: 760, y: 392)); line.lineWidth = 1
          NSColor(calibratedWhite: 0.87, alpha: 1).setStroke(); line.stroke()
          if let logo = NSImage(contentsOfFile: "assets/ssm-logo.png") {
            let scale = min(250 / logo.size.width, 64 / logo.size.height)
            let sz = NSSize(width: logo.size.width * scale, height: logo.size.height * scale)
            logo.draw(in: NSRect(x: 30, y: 404, width: sz.width, height: sz.height), from: .zero, operation: .sourceOver, fraction: 1)
          }
          let title = NSAttributedString(string: "Lock Release", attributes: [.font:NSFont.systemFont(ofSize:22, weight:.semibold), .foregroundColor:NSColor(calibratedWhite:0.15, alpha:1)])
          title.draw(at: NSPoint(x:310, y:424))
          let sub = NSAttributedString(string: "Drag Lock Release to Applications", attributes: [.font:NSFont.systemFont(ofSize:13), .foregroundColor:NSColor(calibratedWhite:0.48, alpha:1)])
          let ss = sub.size(); sub.draw(at:NSPoint(x:(760-ss.width)/2, y:365))
          let arrow = NSAttributedString(string:"→", attributes:[.font:NSFont.systemFont(ofSize:72, weight:.light), .foregroundColor:NSColor(calibratedRed:0.23, green:0.36, blue:0.95, alpha:1)])
          let asz = arrow.size(); arrow.draw(at:NSPoint(x:(760-asz.width)/2, y:184))
          image.unlockFocus()
          let rep = NSBitmapImageRep(data:image.tiffRepresentation!)!
          try rep.representation(using:.png, properties:[:])!.write(to:URL(fileURLWithPath:"dmg-root/.background/background.png"))
          SWIFT
          swift "$RUNNER_TEMP/make-dmg-bg.swift"

      - name: Build polished DMG with matching mounted-volume icon
        run: |
          set -euo pipefail
          RW_DMG="Lock_Release_Mac_Installer_${BUILD_VERSION}_RW.dmg"
          DMG="Locks_Tracker_Installer_${BUILD_VERSION}.dmg"
          rm -f "$RW_DMG" "$DMG" "$DMG.sha256"
          hdiutil create -volname "Lock Release" -srcfolder dmg-root -fs HFS+ -ov -format UDRW "$RW_DMG"
          ATTACH_OUTPUT="$(hdiutil attach -readwrite -noverify -noautoopen "$RW_DMG")"
          DEVICE="$(printf '%s\n' "$ATTACH_OUTPUT" | awk '/^\/dev\// {print $1; exit}')"
          MOUNT_POINT="$(printf '%s\n' "$ATTACH_OUTPUT" | sed -n 's#^.*\(/Volumes/.*\)$#\1#p' | tail -1)"
          test -n "$DEVICE" && test -d "$MOUNT_POINT"

          cat > "$RUNNER_TEMP/set-icon.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let a = CommandLine.arguments
          guard a.count == 3, let icon = NSImage(contentsOfFile: a[1]) else { exit(2) }
          if !NSWorkspace.shared.setIcon(icon, forFile: a[2], options: []) { exit(3) }
          SWIFT
          swift "$RUNNER_TEMP/set-icon.swift" "$PWD/dmg-art/drive-icon.png" "$MOUNT_POINT"

          SETFILE="$(xcrun --find SetFile 2>/dev/null || true)"
          if [ -n "$SETFILE" ]; then
            "$SETFILE" -a C "$MOUNT_POINT" || true
            [ -e "$MOUNT_POINT/.VolumeIcon.icns" ] && "$SETFILE" -a V "$MOUNT_POINT/.VolumeIcon.icns" || true
            "$SETFILE" -a V "$MOUNT_POINT/.background" || true
          fi

          echo "Mounted volume metadata:"
          xattr "$MOUNT_POINT" || true
          ls -la "$MOUNT_POINT" | head -30

          osascript <<'APPLESCRIPT'
          tell application "Finder"
            tell disk "Lock Release"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set pathbar visible of container window to false
              set the bounds of container window to {120, 120, 880, 600}
              set opts to the icon view options of container window
              set arrangement of opts to not arranged
              set icon size of opts to 128
              set text size of opts to 14
              set background picture of opts to file ".background:background.png"
              set position of item "Lock Release.app" of container window to {190, 255}
              set position of item "Applications" of container window to {570, 255}
              update without registering applications
              delay 2
              close container window
              open
              delay 2
            end tell
          end tell
          APPLESCRIPT

          sync
          hdiutil detach "$DEVICE"
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG"
          rm -f "$RW_DMG"
          hdiutil verify "$DMG"

          # Give the DMG file itself the same custom icon.
          swift "$RUNNER_TEMP/set-icon.swift" "$PWD/dmg-art/drive-icon.png" "$PWD/$DMG"

          if [ "$SIGNING_READY" = "1" ]; then
            codesign --force --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" --timestamp "$DMG"
            codesign --verify --verbose=2 "$DMG"
          fi
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Notarize and staple installer
        if: env.NOTARY_MODE != 'none'
        run: |
          set -euo pipefail
          DMG="Locks_Tracker_Installer_${BUILD_VERSION}.dmg"
          if [ "$NOTARY_MODE" = "api" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            xcrun notarytool submit "$DMG" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          else
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Package for Finder icon preservation
        run: |
          set -euo pipefail
          DMG="Locks_Tracker_Installer_${BUILD_VERSION}.dmg"
          DIST="Locks Tracker Installer ${BUILD_VERSION}"
          ZIP="Locks_Tracker_Installer_${BUILD_VERSION}_FIXED_ICONS.zip"
          rm -rf "$DIST" "$ZIP"
          mkdir -p "$DIST"
          ditto "$DMG" "$DIST/Locks Tracker Installer.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$DIST" "$ZIP"
          test -s "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: Lock-Release-Mac-DMG-1.0.64-FIXED-MOUNTED-ICON
          path: |
            Locks_Tracker_Installer_1.0.64_FIXED_ICONS.zip
            Locks_Tracker_Installer_1.0.64.dmg
            Locks_Tracker_Installer_1.0.64.dmg.sha256
            dmg-art/drive-icon.png
          compression-level: 0
