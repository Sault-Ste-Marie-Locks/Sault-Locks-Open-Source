name: Build Proper macOS DMG

on:
  push:
    branches: [ build-mac-dmg-fix ]
  workflow_dispatch:

jobs:
  mac-dmg:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_VERSION="1.0.64"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.version = '1.0.64';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          fs.writeFileSync('.lock-release-version', '1.0.64\n');
          NODE

      - name: Build native macOS app icon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-icon.iconset
          mkdir build-icon.iconset
          SRC="assets/lock-release.png"
          sips -z 16 16 "$SRC" --out build-icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 "$SRC" --out build-icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 "$SRC" --out build-icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 "$SRC" --out build-icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 "$SRC" --out build-icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 "$SRC" --out build-icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 "$SRC" --out build-icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 "$SRC" --out build-icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 "$SRC" --out build-icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 "$SRC" --out build-icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns build-icon.iconset -o assets/lock-release.icns

      - name: Build clean DMG icon with Pillow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .dmg-icon-venv
          source .dmg-icon-venv/bin/activate
          python -m pip install --quiet pillow
          rm -rf dmg-volume.iconset dmg-volume-verify.iconset
          mkdir -p dmg-volume.iconset dmg-art
          python <<'PY'
          from PIL import Image, ImageOps
          src = Image.open('assets/dmg-volume-icon.png').convert('RGBA')
          specs = [
              ('icon_16x16.png',16),('icon_16x16@2x.png',32),
              ('icon_32x32.png',32),('icon_32x32@2x.png',64),
              ('icon_128x128.png',128),('icon_128x128@2x.png',256),
              ('icon_256x256.png',256),('icon_256x256@2x.png',512),
              ('icon_512x512.png',512),('icon_512x512@2x.png',1024),
          ]
          for name, size in specs:
              canvas = Image.new('RGBA', (size, size), (0,0,0,0))
              limit = max(1, int(size * 0.92))
              icon = ImageOps.contain(src, (limit, limit), Image.Resampling.LANCZOS)
              pos = ((size-icon.width)//2, (size-icon.height)//2)
              canvas.alpha_composite(icon, pos)
              canvas.save('dmg-volume.iconset/' + name, format='PNG', optimize=False)
          PY
          iconutil -c icns dmg-volume.iconset -o dmg-volume.icns
          test -s dmg-volume.icns
          iconutil -c iconset dmg-volume.icns -o dmg-volume-verify.iconset
          cp dmg-volume-verify.iconset/icon_512x512@2x.png dmg-art/dmg-volume-preview.png
          test -s dmg-art/dmg-volume-preview.png

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save @electron/universal
          brew install create-dmg

      - name: Build Intel and Apple Silicon apps
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-x64 dist-arm64 dist-universal dmg-stage
          npx electron-packager . "Lock Release" --platform=darwin --arch=x64 --overwrite --out=dist-x64 --ignore="^/dist" --ignore="^/update-payload"
          npx electron-packager . "Lock Release" --platform=darwin --arch=arm64 --overwrite --out=dist-arm64 --ignore="^/dist" --ignore="^/update-payload"

      - name: Merge universal app and apply app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-universal
          node <<'NODE'
          const path = require('path');
          const { makeUniversalApp } = require('@electron/universal');
          const root = process.cwd();
          makeUniversalApp({
            x64AppPath: path.join(root, 'dist-x64/Lock Release-darwin-x64/Lock Release.app'),
            arm64AppPath: path.join(root, 'dist-arm64/Lock Release-darwin-arm64/Lock Release.app'),
            outAppPath: path.join(root, 'dist-universal/Lock Release.app'),
            force: true,
          }).catch(err => { console.error(err); process.exit(1); });
          NODE
          APP="dist-universal/Lock Release.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Lock Release" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Lock Release" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile lock-release.icns" "$APP/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string lock-release.icns" "$APP/Contents/Info.plist"
          cp assets/lock-release.icns "$APP/Contents/Resources/lock-release.icns"
          codesign --force --deep --sign - "$APP"

      - name: Create branded DMG background
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dmg-art dmg-stage
          ditto "dist-universal/Lock Release.app" "dmg-stage/Lock Release.app"
          cat > /tmp/make-bg.swift <<'SWIFT'
          import AppKit
          let canvas = NSSize(width: 760, height: 480)
          let image = NSImage(size: canvas)
          image.lockFocus()
          NSColor(calibratedWhite: 0.985, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(origin: .zero, size: canvas)).fill()
          if let logo = NSImage(contentsOfFile: "assets/ssm-logo.png") {
            let scale = min(250/logo.size.width, 64/logo.size.height)
            let size = NSSize(width: logo.size.width*scale, height: logo.size.height*scale)
            logo.draw(in: NSRect(x: 30, y: 404, width: size.width, height: size.height))
          }
          let title = NSAttributedString(string: "Lock Release", attributes: [.font:NSFont.systemFont(ofSize:22, weight:.semibold), .foregroundColor:NSColor(calibratedWhite:0.15, alpha:1)])
          title.draw(at: NSPoint(x:310,y:424))
          let sub = NSAttributedString(string: "Drag Lock Release to Applications", attributes: [.font:NSFont.systemFont(ofSize:13), .foregroundColor:NSColor(calibratedWhite:0.48, alpha:1)])
          let s=sub.size(); sub.draw(at:NSPoint(x:(760-s.width)/2,y:365))
          let arrow = NSAttributedString(string:"→", attributes:[.font:NSFont.systemFont(ofSize:72, weight:.light), .foregroundColor:NSColor(calibratedRed:0.23,green:0.36,blue:0.95,alpha:1)])
          let a=arrow.size(); arrow.draw(at:NSPoint(x:(760-a.width)/2,y:184))
          image.unlockFocus()
          let rep=NSBitmapImageRep(data:image.tiffRepresentation!)!
          try rep.representation(using:.png, properties:[:])!.write(to:URL(fileURLWithPath:"dmg-art/background.png"))
          SWIFT
          swift /tmp/make-bg.swift

      - name: Build and force custom mounted-volume icon
        shell: bash
        run: |
          set -euo pipefail
          BASE_DMG="Lock_Release_Mac_Installer_${BUILD_VERSION}_BASE.dmg"
          RW_DMG="Lock_Release_Mac_Installer_${BUILD_VERSION}_RW.dmg"
          FINAL_DMG="Lock_Release_Mac_Installer_${BUILD_VERSION}_ICON_FINAL.dmg"
          rm -f "$BASE_DMG" "$RW_DMG" "$FINAL_DMG" "$FINAL_DMG.sha256"
          create-dmg --volname "Lock Release 1.0.64 Final" --volicon "dmg-volume.icns" --background "dmg-art/background.png" --window-pos 120 120 --window-size 760 480 --icon-size 128 --text-size 14 --icon "Lock Release.app" 190 255 --hide-extension "Lock Release.app" --app-drop-link 570 255 --no-internet-enable "$BASE_DMG" "dmg-stage"
          hdiutil convert "$BASE_DMG" -format UDRW -o "$RW_DMG"
          ATTACH_OUTPUT="$(hdiutil attach -readwrite -noverify -noautoopen "$RW_DMG")"
          DEVICE="$(printf '%s\n' "$ATTACH_OUTPUT" | awk '/^\/dev\// {print $1; exit}')"
          MOUNT_POINT="$(printf '%s\n' "$ATTACH_OUTPUT" | sed -n 's#^.*\(/Volumes/.*\)$#\1#p' | tail -1)"
          cp -f dmg-volume.icns "$MOUNT_POINT/.VolumeIcon.icns"
          SETFILE="$(xcrun --find SetFile)"
          "$SETFILE" -a C "$MOUNT_POINT"
          "$SETFILE" -a V "$MOUNT_POINT/.VolumeIcon.icns"
          chflags hidden "$MOUNT_POINT/.VolumeIcon.icns" || true
          sync
          test -s "$MOUNT_POINT/.VolumeIcon.icns"
          hdiutil detach "$DEVICE"
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -o "$FINAL_DMG"
          hdiutil verify "$FINAL_DMG"
          shasum -a 256 "$FINAL_DMG" > "$FINAL_DMG.sha256"

      - name: Upload finished DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lock-Release-Mac-DMG-1.0.64-ICON-FINAL
          path: |
            Lock_Release_Mac_Installer_1.0.64_ICON_FINAL.dmg
            Lock_Release_Mac_Installer_1.0.64_ICON_FINAL.dmg.sha256
            dmg-art/dmg-volume-preview.png
          if-no-files-found: error
          compression-level: 0
