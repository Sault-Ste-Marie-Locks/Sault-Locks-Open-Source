name: Build Proper macOS DMG

on:
  push:
    branches: [ build-mac-dmg-fix ]
  workflow_dispatch:

jobs:
  mac-dmg:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_VERSION="1.0.64"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.version = '1.0.64';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          fs.writeFileSync('.lock-release-version', '1.0.64\n');
          NODE

      - name: Build native macOS app icon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-icon.iconset
          mkdir build-icon.iconset
          SRC="assets/lock-release.png"
          test -s "$SRC"
          sips -z 16 16     "$SRC" --out build-icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32     "$SRC" --out build-icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32     "$SRC" --out build-icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64     "$SRC" --out build-icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128   "$SRC" --out build-icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256   "$SRC" --out build-icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   "$SRC" --out build-icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512   "$SRC" --out build-icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512   "$SRC" --out build-icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 "$SRC" --out build-icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns build-icon.iconset -o assets/lock-release.icns
          test -s assets/lock-release.icns

      - name: Build clean DMG volume icon from uploaded image
        shell: bash
        run: |
          set -euo pipefail
          SRC="assets/dmg-volume-icon.png"
          test -s "$SRC"

          cat > /tmp/make-volume-icon.swift <<'SWIFT'
          import AppKit

          let source = NSImage(contentsOfFile: "assets/dmg-volume-icon.png")!
          let canvasSize = NSSize(width: 1024, height: 1024)
          let canvas = NSImage(size: canvasSize)
          canvas.lockFocus()
          NSColor.clear.setFill()
          NSBezierPath(rect: NSRect(origin: .zero, size: canvasSize)).fill()

          let maxSide: CGFloat = 900
          let scale = min(maxSide / source.size.width, maxSide / source.size.height)
          let size = NSSize(width: source.size.width * scale, height: source.size.height * scale)
          let rect = NSRect(
            x: (canvasSize.width - size.width) / 2,
            y: (canvasSize.height - size.height) / 2,
            width: size.width,
            height: size.height
          )
          source.draw(in: rect, from: .zero, operation: .sourceOver, fraction: 1)
          canvas.unlockFocus()

          let rep = NSBitmapImageRep(data: canvas.tiffRepresentation!)!
          let png = rep.representation(using: .png, properties: [:])!
          try png.write(to: URL(fileURLWithPath: "dmg-art-volume-source.png"))
          SWIFT

          swift /tmp/make-volume-icon.swift

          rm -rf dmg-volume.iconset
          mkdir dmg-volume.iconset
          sips -z 16 16     dmg-art-volume-source.png --out dmg-volume.iconset/icon_16x16.png >/dev/null
          sips -z 32 32     dmg-art-volume-source.png --out dmg-volume.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32     dmg-art-volume-source.png --out dmg-volume.iconset/icon_32x32.png >/dev/null
          sips -z 64 64     dmg-art-volume-source.png --out dmg-volume.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128   dmg-art-volume-source.png --out dmg-volume.iconset/icon_128x128.png >/dev/null
          sips -z 256 256   dmg-art-volume-source.png --out dmg-volume.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   dmg-art-volume-source.png --out dmg-volume.iconset/icon_256x256.png >/dev/null
          sips -z 512 512   dmg-art-volume-source.png --out dmg-volume.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512   dmg-art-volume-source.png --out dmg-volume.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 dmg-art-volume-source.png --out dmg-volume.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns dmg-volume.iconset -o dmg-volume.icns
          test -s dmg-volume.icns

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save @electron/universal
          brew install create-dmg

      - name: Build Intel and Apple Silicon apps
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-x64 dist-arm64 dist-universal dmg-stage dmg-art
          npx electron-packager . "Lock Release" \
            --platform=darwin --arch=x64 --overwrite --out=dist-x64 \
            --ignore="^/dist" --ignore="^/update-payload"
          npx electron-packager . "Lock Release" \
            --platform=darwin --arch=arm64 --overwrite --out=dist-arm64 \
            --ignore="^/dist" --ignore="^/update-payload"

      - name: Merge universal app and apply app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-universal
          node <<'NODE'
          const path = require('path');
          const { makeUniversalApp } = require('@electron/universal');
          const root = process.cwd();
          makeUniversalApp({
            x64AppPath: path.join(root, 'dist-x64/Lock Release-darwin-x64/Lock Release.app'),
            arm64AppPath: path.join(root, 'dist-arm64/Lock Release-darwin-arm64/Lock Release.app'),
            outAppPath: path.join(root, 'dist-universal/Lock Release.app'),
            force: true,
          }).catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

          APP="dist-universal/Lock Release.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Lock Release" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Lock Release" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile lock-release.icns" "$APP/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string lock-release.icns" "$APP/Contents/Info.plist"
          cp assets/lock-release.icns "$APP/Contents/Resources/lock-release.icns"
          codesign --force --deep --sign - "$APP"

      - name: Create branded DMG background
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dmg-art dmg-stage
          ditto "dist-universal/Lock Release.app" "dmg-stage/Lock Release.app"

          cat > /tmp/make-dmg-bg.swift <<'SWIFT'
          import AppKit

          let canvas = NSSize(width: 760, height: 480)
          let image = NSImage(size: canvas)
          image.lockFocus()
          NSColor(calibratedWhite: 0.985, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(origin: .zero, size: canvas)).fill()

          let line = NSBezierPath()
          line.move(to: NSPoint(x: 0, y: 392))
          line.line(to: NSPoint(x: 760, y: 392))
          line.lineWidth = 1
          NSColor(calibratedWhite: 0.87, alpha: 1).setStroke()
          line.stroke()

          if let logo = NSImage(contentsOfFile: "assets/ssm-logo.png") {
              let maxW: CGFloat = 250
              let scale = min(maxW / logo.size.width, 64 / logo.size.height)
              let sz = NSSize(width: logo.size.width * scale, height: logo.size.height * scale)
              logo.draw(in: NSRect(x: 30, y: 404, width: sz.width, height: sz.height), from: .zero, operation: .sourceOver, fraction: 1)
          }

          let title = NSAttributedString(string: "Lock Release", attributes: [
              .font: NSFont.systemFont(ofSize: 22, weight: .semibold),
              .foregroundColor: NSColor(calibratedWhite: 0.15, alpha: 1)
          ])
          title.draw(at: NSPoint(x: 310, y: 424))

          let sub = NSAttributedString(string: "Drag Lock Release to Applications", attributes: [
              .font: NSFont.systemFont(ofSize: 13),
              .foregroundColor: NSColor(calibratedWhite: 0.48, alpha: 1)
          ])
          let subSize = sub.size()
          sub.draw(at: NSPoint(x: (760 - subSize.width) / 2, y: 365))

          let arrow = NSAttributedString(string: "→", attributes: [
              .font: NSFont.systemFont(ofSize: 72, weight: .light),
              .foregroundColor: NSColor(calibratedRed: 0.23, green: 0.36, blue: 0.95, alpha: 1)
          ])
          let arrowSize = arrow.size()
          arrow.draw(at: NSPoint(x: (760 - arrowSize.width) / 2, y: 184))

          image.unlockFocus()
          let rep = NSBitmapImageRep(data: image.tiffRepresentation!)!
          let png = rep.representation(using: .png, properties: [:])!
          try png.write(to: URL(fileURLWithPath: "dmg-art/background.png"))
          SWIFT

          swift /tmp/make-dmg-bg.swift

      - name: Build DMG with clean mounted-volume icon
        shell: bash
        run: |
          set -euo pipefail
          DMG="Lock_Release_Mac_Installer_${BUILD_VERSION}_VOLUME_ICON_FIXED.dmg"
          rm -f "$DMG" "$DMG.sha256"

          create-dmg \
            --volname "Lock Release Installer Fixed" \
            --volicon "dmg-volume.icns" \
            --background "dmg-art/background.png" \
            --window-pos 120 120 \
            --window-size 760 480 \
            --icon-size 128 \
            --text-size 14 \
            --icon "Lock Release.app" 190 255 \
            --hide-extension "Lock Release.app" \
            --app-drop-link 570 255 \
            --no-internet-enable \
            "$DMG" \
            "dmg-stage"

          test -s "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Upload finished DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lock-Release-Mac-DMG-1.0.64-VOLUME-ICON-FIXED
          path: |
            Lock_Release_Mac_Installer_1.0.64_VOLUME_ICON_FIXED.dmg
            Lock_Release_Mac_Installer_1.0.64_VOLUME_ICON_FIXED.dmg.sha256
          if-no-files-found: error
          compression-level: 0
