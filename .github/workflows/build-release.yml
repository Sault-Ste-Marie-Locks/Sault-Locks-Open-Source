name: Build Lock Release Desktop Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - id: version
        shell: bash
        run: echo "build_version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  update-payload:
    needs: version
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Stamp build version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.env.BUILD_VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          printf '%s' "$BUILD_VERSION" > .lock-release-version

      - name: Build cross-platform source update
        shell: bash
        run: |
          zip -qry Lock_Release_Update.zip . \
            -x 'node_modules/*' 'dist/*' 'dist-x64/*' 'dist-arm64/*' 'dist-universal/*' '.git/*' '.github/*' \
               'database/*' 'data/*' 'data-backup/*' 'update-payload/*'
          test -s Lock_Release_Update.zip

      - name: Upload source update artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-update
          path: Lock_Release_Update.zip
          retention-days: 3

  windows:
    needs: version
    runs-on: windows-latest
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Stamp build version
        shell: pwsh
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $env:BUILD_VERSION
          [System.IO.File]::WriteAllText((Resolve-Path package.json), ($pkg | ConvertTo-Json -Depth 50), $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD ".lock-release-version"), $env:BUILD_VERSION, $utf8NoBom)

      - name: Install build dependencies
        shell: pwsh
        run: npm ci

      - name: Build full Windows app
        shell: pwsh
        run: |
          npm run build-win
          $packageDir = Join-Path $PWD "dist\Lock Release-win32-x64"
          if (-not (Test-Path (Join-Path $packageDir "Lock Release.exe"))) {
            throw "Packaged Lock Release.exe was not created."
          }
          $appDir = Join-Path $packageDir "resources\app"
          if (-not (Test-Path (Join-Path $appDir "package.json"))) {
            throw "Packaged resources/app source was not created."
          }
          foreach ($name in @("database","data","data-backup","dist","dist-x64","dist-arm64","dist-universal","update-payload",".git",".github")) {
            Remove-Item (Join-Path $appDir $name) -Recurse -Force -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "Lock_Release_Windows.zip" -Force

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Lock_Release_Windows.zip
          retention-days: 3

  mac:
    needs: version
    runs-on: macos-latest
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Stamp build version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.env.BUILD_VERSION; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          printf '%s' "$BUILD_VERSION" > .lock-release-version

      - name: Install build dependencies
        shell: bash
        run: |
          npm ci
          npm install --no-save @electron/universal

      - name: Build universal macOS app
        shell: bash
        run: |
          rm -rf dist-x64 dist-arm64 dist-universal dmg-root
          npx electron-packager . "Lock Release" --platform=darwin --arch=x64 --overwrite --out=dist-x64 --no-asar --ignore="^/dist" --ignore="^/update-payload"
          npx electron-packager . "Lock Release" --platform=darwin --arch=arm64 --overwrite --out=dist-arm64 --no-asar --ignore="^/dist" --ignore="^/update-payload"
          mkdir -p dist-universal
          node <<'NODE'
          const path = require('path');
          const { makeUniversalApp } = require('@electron/universal');
          (async () => {
            await makeUniversalApp({
              x64AppPath: path.resolve('dist-x64/Lock Release-darwin-x64/Lock Release.app'),
              arm64AppPath: path.resolve('dist-arm64/Lock Release-darwin-arm64/Lock Release.app'),
              outAppPath: path.resolve('dist-universal/Lock Release.app'),
              force: true
            });
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          APP="dist-universal/Lock Release.app"
          test -d "$APP"
          APP_SOURCE="$APP/Contents/Resources/app"
          test -f "$APP_SOURCE/package.json"
          node --check "$APP_SOURCE/main.js"
          for name in database data data-backup dist dist-x64 dist-arm64 dist-universal update-payload .git .github; do
            rm -rf "$APP_SOURCE/$name"
          done

      - name: Verify updater is inside app
        shell: bash
        run: |
          APP_SOURCE="dist-universal/Lock Release.app/Contents/Resources/app"
          grep -q "/usr/bin/ditto" "$APP_SOURCE/main.js"
          grep -q "process.platform === 'darwin'" "$APP_SOURCE/main.js"
          grep -q "Lock_Release_Update.zip" "$APP_SOURCE/main.js"
          if grep -n "const zipPath = path.join(tempDir, 'Lock_Release_Windows.zip')" "$APP_SOURCE/main.js"; then
            echo "Broken Windows-only update path is still present" >&2
            exit 1
          fi

      - name: Create universal macOS DMG and ZIP
        shell: bash
        run: |
          APP="dist-universal/Lock Release.app"
          DMG="Lock_Release_Mac_Universal.dmg"
          ZIP="Lock_Release_Mac_Universal.zip"
          mkdir -p dmg-root
          ditto "$APP" "dmg-root/Lock Release.app"
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Lock Release" -srcfolder dmg-root -ov -format UDZO "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          test -s "$DMG"
          test -s "$ZIP"

      - name: Upload universal macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac-universal
          path: |
            Lock_Release_Mac_Universal.dmg
            Lock_Release_Mac_Universal.zip
          retention-days: 3

  release:
    needs: [version, update-payload, windows, mac]
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
      GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish release to public updates repo
        shell: bash
        run: |
          ls -lah release-artifacts
          gh release view "v$BUILD_VERSION" --repo Sault-Ste-Marie-Locks/Locks-Dashboard-Manager-Updates >/dev/null 2>&1 && \
            gh release delete "v$BUILD_VERSION" --repo Sault-Ste-Marie-Locks/Locks-Dashboard-Manager-Updates --yes --cleanup-tag || true
          gh release create "v$BUILD_VERSION" release-artifacts/* \
            --repo Sault-Ste-Marie-Locks/Locks-Dashboard-Manager-Updates \
            --title "Lock Release v$BUILD_VERSION" \
            --notes "Cross-platform Lock Release desktop build with Windows, macOS, and the shared automatic update payload."
