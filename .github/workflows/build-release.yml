name: Build Lock Release Windows Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Set automatic build version
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          Write-Host "BUILD_VERSION=$version"
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $version
          [System.IO.File]::WriteAllText((Resolve-Path package.json), ($pkg | ConvertTo-Json -Depth 50), $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD ".lock-release-version"), $version, $utf8NoBom)

      - name: Create source update ZIP
        shell: pwsh
        run: |
          Remove-Item update-payload -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "update-payload\resources\app" -Force | Out-Null

          $exclude = @(
            ".git",
            "node_modules",
            "dist",
            "update-payload",
            "database",
            "data",
            "data-backup",
            "*.zip",
            "*.exe",
            "*.log"
          )

          Get-ChildItem -Force | Where-Object {
            $name = $_.Name
            -not ($exclude | Where-Object { $name -like $_ })
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination "update-payload\resources\app" -Recurse -Force
          }

          # The app now delta-copies on install, so unchanged files inside this ZIP are not rewritten locally.
          Compress-Archive -Path "update-payload\*" -DestinationPath "Lock_Release_Windows.zip" -Force

      - name: Publish release to public updates repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          gh release view "v$env:BUILD_VERSION" --repo OfficialUnrealNetwork/Locks-Dashboard-Manager-Updates *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "v$env:BUILD_VERSION" --repo OfficialUnrealNetwork/Locks-Dashboard-Manager-Updates --yes
          }

          gh release create "v$env:BUILD_VERSION" "Lock_Release_Windows.zip" --repo OfficialUnrealNetwork/Locks-Dashboard-Manager-Updates --title "Lock Release v$env:BUILD_VERSION" --notes "Automatic Lock Release desktop source update. V18 includes the Pterodactyl app-file fixes and excludes database/data folders from updates so user data is not overwritten."
