name: Build Lock Release Windows Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Set automatic build version
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          Write-Host "BUILD_VERSION=$version"
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $version
          [System.IO.File]::WriteAllText((Resolve-Path package.json), ($pkg | ConvertTo-Json -Depth 50), $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $PWD ".lock-release-version"), $version, $utf8NoBom)

      - name: Install build dependencies
        shell: pwsh
        run: npm ci

      - name: Build full Windows app
        shell: pwsh
        run: |
          npm run build-win

          $packageDir = Join-Path $PWD "dist\Lock Release-win32-x64"
          if (-not (Test-Path (Join-Path $packageDir "Lock Release.exe"))) {
            throw "Packaged Lock Release.exe was not created."
          }

          $appDir = Join-Path $packageDir "resources\app"
          if (-not (Test-Path (Join-Path $appDir "package.json"))) {
            throw "Packaged resources/app source was not created."
          }

          foreach ($name in @("database","data","data-backup","dist","update-payload",".git",".github")) {
            Remove-Item (Join-Path $appDir $name) -Recurse -Force -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "Lock_Release_Windows.zip" -Force

      - name: Publish release to public updates repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          gh release view "v$env:BUILD_VERSION" --repo OfficialUnrealNetwork/Locks-Dashboard-Manager-Updates *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "v$env:BUILD_VERSION" --repo OfficialUnrealNetwork/Locks-Dashboard-Manager-Updates --yes --cleanup-tag
          }

          gh release create "v$env:BUILD_VERSION" "Lock_Release_Windows.zip" `
            --repo OfficialUnrealNetwork/Locks-Dashboard-Manager-Updates `
            --title "Lock Release v$env:BUILD_VERSION" `
            --notes "Emergency updater recovery. Restores the proven auto-update engine while keeping the rebuilt Locks Tracker application and supports automatic recovery from v1.0.64-v1.0.66."
